version: 2
updates:
# Fetch and update latest `npm` packages
- package-ecosystem: npm
  directory: '/'
  schedule:
    interval: daily
    time: '00:00'
  open-pull-requests-limit: 10
  reviewers:
    - markusressel
  assignees:
    - markusressel
  commit-message:
    prefix: fix
    prefix-development: chore
    include: scope
  ignore:
    # must match the Node.js version used for builds (netlify.toml, CI)
    - dependency-name: '@types/node'
      update-types:
        - version-update:semver-major
  # one PR for all minor and patch updates, major updates get their own PR
  groups:
    npm-minor-and-patch:
      update-types:
        - minor
        - patch
# Fetch and update latest `github-actions` pkgs
- package-ecosystem: github-actions
  directory: '/'
  schedule:
    interval: daily
    time: '00:00'
  open-pull-requests-limit: 10
  reviewers:
    - markusressel
  assignees:
    - markusressel
  commit-message:
    prefix: fix
    prefix-development: chore
    include: scope
  groups:
    github-actions:
      patterns:
        - '*'
