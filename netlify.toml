[build]
  command = "yarn generate"
  # on Netlify, Nitro uses the netlify-static preset, which writes to dist/
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  YARN_VERSION = "1.22.22"
  YARN_FLAGS = "--ignore-engines"

# blog pages used to be addressed as /blog?page=2
[[redirects]]
  from = "/blog"
  query = { page = ":page" }
  to = "/blog/page/:page"
  status = 301
  force = true
